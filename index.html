<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关卡设计作品集 · asher</title>
<style>
  :root{--ink:#111827;--sub:#4B5563;--mut:#9CA3AF;--line:#E5E7EB;--paper:#F4F4F1;--teal:#0E7C86}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;line-height:1.75}
  .wrap{max-width:880px;margin:0 auto;padding:72px 28px 96px}
  .kicker{font-size:13px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;margin-bottom:16px}
  h1{font-size:38px;line-height:1.3;margin:0 0 16px;font-weight:800;letter-spacing:-.5px}
  .lead{font-size:16px;color:var(--sub);margin:0 0 44px;max-width:620px}
  .list{display:grid;gap:16px}
  a.piece{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;
          padding:22px 26px;text-decoration:none;color:inherit;transition:border-color .15s}
  a.piece:hover{border-color:var(--teal)}
  a.piece b{display:block;font-size:18px;margin-bottom:6px}
  a.piece span{display:block;font-size:13.5px;color:var(--sub)}
  a.piece em{display:block;font-style:normal;font-size:11.5px;color:var(--mut);margin-top:10px;letter-spacing:.04em}
  .soon{border-style:dashed;opacity:.6;cursor:default}
  footer{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Level Design Portfolio</div>
  <h1>关卡设计作品集 · asher</h1>
  <p class="lead">拆解、白盒、原型。每件都写清楚：为什么这样设计、我拿什么证明。</p>

  <div class="list">
    <a class="piece" href="p2-teardown/">
      <b>01 · Portal 2 新手教学的七个房间</b>
      <span>七张手工平面图 + 代价表 + 三条结论，把「教学」拆成可数的东西。</span>
      <em>拆解 · 2026-11</em>
    </a>
    <div class="piece soon">
      <b>02 · 箱庭（开发中）</b>
      <span>垂直探索箱庭：一个情绪目标，三段节奏，一个该被记住的瞬间。</span>
      <em>原创关卡 · 进行中</em>
    </div>
    <div class="piece soon">
      <b>03 · 传送门机制原型（开发中）</b>
      <span>两房间应用关：一条明路、一条发现路。</span>
      <em>机制原型 · 进行中</em>
    </div>
  </div>

  <footer>素材与推断边界在各页页脚注明 · 2026-11-22</footer>
</div>
</body>
</html>
